name: Update public routes
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_public.py
      - run: python scripts/build_routes.py --routes cache/public/routes.csv --airports cache/public/airports.csv --airlines cache/public/airlines.csv
      - name: Publish only changed data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cache/source_meta.json data/user_routes.json dist/routes.sqlite dist/meta.json
          git diff --cached --quiet || (git commit -m "Update public flight routes" && git push)
